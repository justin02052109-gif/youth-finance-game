,['高階水電技師',108,'水電',0,'水電',5,4,'外勤',[4,7,10,13,16]],['精密設備維修技師',120,'維修',0,'維修',5,3,'精密維修',[3,6,9,12,15,17]],['獨立設計接案者',96,'設計',0,'設計',4,7,'彈性接案',[4,7,10,13,16]],['高績效業務人員',132,'業務',0,'行銷',5,2,'業績壓力',[5,8,11,14,17]],['連鎖門市區域主管',96,'零售',0,'',6,3,'跨店管理',[4,7,10,13,16]],['專業餐飲主廚',108,'餐飲',0,'餐飲',5,2,'餐飲管理',[3,6,9,12,15,17]]];
const days=n=>({1:45,2:65,3:75,4:90,5:100,6:110,7:125,8:140}[n]||0);

const fresh=()=>({age:18,cash:30,debt:0,degree:0,study:{},skills:[],exp:{},free:0,history:[],experiences:[],goals:[],current:'尚未開始'});let s=fresh(),tab='教育',pick=null,backup=null,branchEnd=null,notice='',goalDone=false;const clone=x=>JSON.parse(JSON.stringify(x));const fmt=x=>Number(x.toFixed(2)).toLocaleString('zh-TW');const degreeNames=['高中職','專科','大學','碩士'];const escape=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function options(state=s){let y=state.age-17, arr=[];for(let [id,name,len,fee,time,deg] of education){let complete=(state.study[id]||0)>=len,ok=!complete&&(id!=='master'||state.degree>=2);let cost=fee-([4,13].includes(y)?3:0);arr.push({id,cat:'教育',name,net:-12-cost,free:time,ok,desc:`學費 ${fmt(cost)} 萬｜修業 ${state.study[id]||0}/${len} 年`,educationCost:cost,study:id,inc:1,len,deg});arr.push({id:id+'half',cat:'教育',name:name+'・半工半讀',net:18-12-cost,free:1,ok,desc:`兼職收入18萬｜修業增加0.5年`,salary:18,educationCost:cost,study:id,inc:.5,len,deg,industry:'兼職',exp:.5})}for(let [name,fee,time] of skills){arr.push({id:'skill'+name,cat:'職訓',name:name+'技能培訓',net:-12-fee*([4,13].includes(y)?.5:1),free:time,ok:!state.skills.includes(name),desc:'完成後取得 '+name+' 技能',educationCost:fee*([4,13].includes(y)?.5:1),skill:name})}for(let [name,salary,industry,degree,skill,exp,time,condition,years] of jobs){if(years&&!years.includes(y))continue;let ok=state.degree>=degree&&(!skill||skill.split('、').every(k=>state.skills.includes(k)))&&(state.exp[industry]||0)>=exp;let bonus=(y===7&&['資訊','水電'].includes(industry)?6:y===10&&['設計','行政'].includes(industry)?3:y===16&&['行政','水電','照顧'].includes(industry)?6:0);arr.push({id:name,cat:years?'特殊職缺':'就業',name,net:salary+bonus-12,free:time,ok,desc:`年薪 ${salary+bonus}萬｜${condition}｜${degreeNames[degree]}${skill?'＋'+skill:''}${exp?'＋相關年資'+exp+'年':''}`,salary:salary+bonus,industry,exp:1})}arr.push({id:'travel',cat:'人生選擇',name:'海外打工度假',net:6,free:6,ok:true,desc:'收入30萬，生活及旅行成本24萬',salary:30,experience:'海外打工度假',industry:'服務',exp:1},{id:'rest',cat:'人生選擇',name:'休息與生涯探索',net:-12,free:8,ok:true,desc:'暫停工作與升學，探索方向',experience:'生涯探索'},{id:'care',cat:'人生選擇',name:'家庭照顧',net:-12,free:3,ok:true,desc:'投入家庭照顧時間',experience:'家庭照顧'});return arr.map(o=>({...o,free:o.name==='行政助理'?110:o.name==='自由接案設計師'?140:days(o.free),salary:o.salary||0,educationCost:o.educationCost||0}))}
function canLife(choice,activity,state=s){return !!choice && !!activity && activity.days<=choice.free && activity.cost<=Math.max(0,state.cash+choice.net)+1e-9;}
function advance(choice){if(!choice||!choice.ok||s.age>=35)return;let old=clone(s);old.history=[];let activity=lifeActivities.find(x=>x.id===lifePick);if(activity&&(!canLife(choice,activity)))return alert('可支配時間或資金不足，請調整人生體驗。');let need=Math.max(0,-(s.cash+choice.net));let support=0;if(need>0){if(choice.study){if(!confirm(`資金不足 ${fmt(need)} 萬元。是否申請模擬就學貸款？`))return;s.debt+=need;support=need}else{if(!confirm(`資金不足 ${fmt(need)} 萬元。是否申請模擬生活支持（記為負債）？`))return;s.debt+=need;support=need}}s.cash+=choice.net+support-(activity?.cost||0);if(activity)s.experiences.push(activity.name);if(choice.study){s.study[choice.study]=Math.min(choice.len,(s.study[choice.study]||0)+choice.inc);if(s.study[choice.study]>=choice.len){let d=degreeNames.indexOf(choice.deg);s.degree=Math.max(s.degree,d);if(choice.study==='tech'&&!s.skills.includes('應用技術'))s.skills.push('應用技術')}}if(choice.skill)s.skills.push(choice.skill);if(choice.industry)s.exp[choice.industry]=(s.exp[choice.industry]||0)+choice.exp;if(choice.experience)s.experiences.push(choice.experience);s.free+=choice.free;s.current=choice.name;s.history.push({age:s.age,name:choice.name,cat:choice.cat,net:choice.net-(activity?.cost||0),activityCost:activity?.cost||0,usedDays:activity?.days||0,cash:s.cash,debt:s.debt,free:choice.free,salary:choice.salary,educationCost:choice.educationCost,support,prior:old,after:snapshot(s)});s.age++;lifePick='none';notice=events[s.age-18]||'';pick=null;render()}
const lifeActivities=[{id:'domestic',name:'國內旅遊',cost:1.5,days:3},{id:'foreign',name:'國外旅遊',cost:5,days:7},{id:'family',name:'家庭陪伴',cost:0,days:2},{id:'hobby',name:'興趣課程',cost:1,days:5},{id:'study',name:'短期進修',cost:1.5,days:10},{id:'volunteer',name:'志願服務',cost:0,days:3}];let lifePick='none';function setLife(v){lifePick=v;render()}function setTab(t){tab=t;pick=null;lifePick='none';render()}function choose(id){pick=id;lifePick='none';render();document.getElementById('decision-panel')?.scrollIntoView({block:'nearest',behavior:'smooth'})}function start(){let checked=[...document.querySelectorAll('input[name=goal]:checked')].map(x=>x.value);if(checked.length<2||checked.length>3){alert('請選擇2至3項生活目標');return}s.goals=checked;goalDone=true;render()}function repay(){let n=Math.min(s.cash,s.debt);if(n<=0)return;if(confirm(`使用 ${fmt(n)} 萬元還款？`)){s.cash-=n;s.debt-=n;let h=s.history.at(-1);if(h){h.cash=s.cash;h.debt=s.debt;h.repaid=(h.repaid||0)+n;h.after=snapshot(s)}render()}}
function rewind(){lifePick='none';let age=Number(document.getElementById('rewind').value),h=s.history.find(x=>x.age===age);if(!h)return;backup=clone(s);let history=s.history.filter(x=>x.age<age);s=clone(h.prior);s.history=history;branchEnd=Math.min(35,age+4);pick=null;notice='再次實驗：改變選擇，與原本相同年齡的結果比較。';render()}function restore(){if(backup){s=backup;backup=null;branchEnd=null;notice='';render()}}function reset(){lifePick='none';if(confirm('確定清除本次遊戲？')){s=fresh();goalDone=false;pick=null;backup=null;branchEnd=null;notice='';render()}}
function snapshot(st){let x=clone(st);delete x.history;return x}
function years(st){return Object.values(st.exp).reduce((a,b)=>a+b,0)}
function tags(values){return values.length?values.map(v=>`<span class="tag">${escape(v)}</span>`).join(''):'<span class="muted">尚無</span>'}
function stat(k,v){return `<div class="stat"><small>${k}</small><b>${v}</b></div>`}
function profile(st){return `<section class="profile"><h2>我的生涯資歷</h2><div class="profile-grid"><div class="profile-item"><h3>最高學歷</h3><strong>${degreeNames[st.degree]}</strong>${education.filter(e=>st.study[e[0]]).map(e=>`<div class="study-line">${e[1]} ${st.study[e[0]]}/${e[2]}年 ${st.study[e[0]]>=e[2]?'✓ 完成':''}<progress max="${e[2]}" value="${st.study[e[0]]}"></progress></div>`).join('')}</div><div class="profile-item"><h3>已取得技能 · ${st.skills.length}項</h3><div>${tags(st.skills)}</div></div><div class="profile-item"><h3>累積工作經驗</h3><strong>${fmt(years(st))} 年</strong><div>${tags(Object.entries(st.exp).map(([k,v])=>k+' '+fmt(v)+'年'))}</div></div></div><div class="stats">${stat('存款（萬元）',fmt(st.cash))}${stat('負債（萬元）',fmt(st.debt))}${stat('淨金融資產（萬元）',fmt(st.cash-st.debt))}${stat('累積可支配天數',st.free+' 天')}</div><p>目前安排：<b>${escape(st.current)}</b>　｜　生活目標：${st.goals.map(escape).join('、')}</p>${st.debt?'<button class="secondary" onclick="repay()">償還負債</button>':''}</section>`}
function chart(st){let points=[{age:18,cash:30,debt:0},...st.history.map(h=>({age:h.age+1,cash:h.cash,debt:h.debt}))];let vals=points.flatMap(p=>[p.cash,p.debt,p.cash-p.debt]);let lo=Math.min(0,...vals),hi=Math.max(30,...vals),X=i=>48+i*650/Math.max(1,points.length-1),Y=v=>190-(v-lo)*155/(hi-lo);let lines=[['cash','#167d66','存款'],['debt','#a43c32','負債'],['net','#4668ac','淨資產']];return `<svg class="trend" viewBox="0 0 730 240" role="img" aria-label="歷年存款負債淨資產趨勢">${[0,1,2,3,4].map(i=>{let v=lo+(hi-lo)*i/4;return `<line x1="48" y1="${Y(v)}" x2="698" y2="${Y(v)}" stroke="#dbe5df"/><text x="42" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#627976">${fmt(v)}</text>`}).join('')}${lines.map(([k,c])=>`<polyline fill="none" stroke="${c}" stroke-width="3" points="${points.map((p,i)=>X(i)+','+Y(k==='net'?p.cash-p.debt:p[k])).join(' ')}"/>`).join('')}${points.map((p,i)=>`<text x="${X(i)}" y="211" text-anchor="middle" font-size="11" fill="#627976">${p.age}</text>`).join('')} ${lines.map(([k,c,n],i)=>`<text x="${150+i*140}" y="233" fill="${c}" font-size="13">● ${n}</text>`).join('')}</svg>`}
function extraChart(st,key,label,unit,cumulative=false){let a=0,pts=[{age:18,v:0},...st.history.map(h=>({age:h.age+1,v:cumulative?(a+=(h[key]||0)):(h[key]||0)}))],hi=Math.max(1,...pts.map(p=>p.v)),X=i=>48+i*650/Math.max(1,pts.length-1),Y=v=>190-v*155/hi;return `<h3 class="result-sub">${label}</h3><small>縱軸：${unit}；橫軸：年齡</small><svg class="trend" viewBox="0 0 730 225" role="img" aria-label="${label}">${[0,1,2,3,4].map(i=>`<line x1="48" y1="${Y(hi*i/4)}" x2="698" y2="${Y(hi*i/4)}" stroke="#dbe5df"/><text x="42" y="${Y(hi*i/4)+4}" text-anchor="end" font-size="11">${fmt(hi*i/4)}</text>`).join('')}<polyline fill="none" stroke="#167d66" stroke-width="3" points="${pts.map((p,i)=>X(i)+','+Y(p.v)).join(' ')}"/>${pts.map((p,i)=>`<text x="${X(i)}" y="211" text-anchor="middle" font-size="11">${p.age}</text>`).join('')}</svg>`}
function details(st){let h=st.history,counts={};h.forEach(x=>counts[x.cat||'其他']=(counts[x.cat||'其他']||0)+1);let net=h.reduce((a,x)=>a+x.net,0),borrow=h.reduce((a,x)=>a+(x.support||0),0),repaid=h.reduce((a,x)=>a+(x.repaid||0),0);let first=h.find(x=>['就業','特殊職缺'].includes(x.cat));let experiences={};st.experiences.forEach(x=>experiences[x]=(experiences[x]||0)+1);return `<h3 class="result-sub">財務成果（萬元）</h3><div class="result-grid">${stat('初始資金',30)}${stat('期末存款',fmt(st.cash))}${stat('剩餘負債',fmt(st.debt))}${stat('期末淨資產',fmt(st.cash-st.debt))}${stat('歷年淨收支合計',fmt(net))}${stat('累積工作收入',fmt(h.reduce((a,x)=>a+(x.salary||0),0)))}${stat('累積教育及培訓投入',fmt(h.reduce((a,x)=>a+(x.educationCost||0),0)))}${stat('累積借款／支持負債',fmt(borrow))}${stat('累積還款',fmt(repaid))}${stat('最高年度期末存款',fmt(Math.max(30,...h.map(x=>x.cash))))}</div><h3 class="result-sub">財務變化趨勢</h3><small>縱軸：萬元；橫軸：年齡</small>${chart(st)}${extraChart(st,"salary","歷年工作收入","萬元")}${extraChart(st,"free","累積可支配時間","天",true)}<h3 class="result-sub">生涯發展成果</h3><div class="result-grid">${stat('最高學歷',degreeNames[st.degree])}${stat('技能數量',st.skills.length+'項')}${stat('累積工作經驗',fmt(years(st))+'年')}${stat('首次全職就業年齡',first?first.age+'歲':'尚未')}${stat('目前年度安排',escape(st.current))}${stat('累積可支配天數',st.free+'天')}${stat('平均每年可支配天數',fmt(st.free/Math.max(1,h.length))+'天')}${stat('平均每週可支配天數',fmt(st.free/Math.max(1,h.length)/52)+'天')}${stat('人生體驗使用天數',h.reduce((a,x)=>a+(x.usedDays||0),0)+'天')}${stat('人生體驗支出（萬）',fmt(h.reduce((a,x)=>a+(x.activityCost||0),0)))}</div><p><b>取得技能：</b>${tags(st.skills)}</p><p><b>各產業年資：</b>${tags(Object.entries(st.exp).map(([k,v])=>k+' '+fmt(v)+'年'))}</p><p><b>教育修業紀錄：</b>${tags(education.filter(e=>st.study[e[0]]).map(e=>e[1]+' '+st.study[e[0]]+'/'+e[2]+'年'))}</p><p><b>人生體驗：</b>${tags(Object.entries(experiences).map(([k,v])=>k+' ×'+v))}</p><h3 class="result-sub">人生時間分配</h3><div class="scroll"><table><thead><tr><th>主要活動</th><th>投入年數</th><th>占已完成年度</th></tr></thead><tbody>${Object.entries(counts).map(([k,v])=>`<tr><td>${k}</td><td>${v}年</td><td>${fmt(v/h.length*100)}%</td></tr>`).join('')}</tbody></table></div><p class="muted">可支配天數為模擬的自主生活時間，不代表法定休假或幸福程度。半工半讀同時累積部分工作經驗。</p>`}
function compare(st,original){let prev=original.history.find(h=>h.age===st.age-1)?.after||snapshot(original);let rows=[['存款（萬）',fmt(prev.cash),fmt(st.cash)],['負債（萬）',fmt(prev.debt),fmt(st.debt)],['淨資產（萬）',fmt(prev.cash-prev.debt),fmt(st.cash-st.debt)],['最高學歷',degreeNames[prev.degree],degreeNames[st.degree]],['技能',prev.skills.join('、')||'無',st.skills.join('、')||'無'],['相關年資',Object.entries(prev.exp).map(([k,v])=>k+v+'年').join('、')||'無',Object.entries(st.exp).map(([k,v])=>k+v+'年').join('、')||'無'],['累積可支配天數',prev.free+'天',st.free+'天'],['當年安排',prev.current,st.current],['人生體驗',prev.experiences.join('、')||'無',st.experiences.join('、')||'無']];return `<h3 class="result-sub">同齡人生比較：${st.age}歲</h3><div class="scroll"><table class="comparison"><thead><tr><th>項目</th><th>原路徑</th><th>新路徑</th></tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(v=>'<td>'+escape(v)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`}
function render(){document.getElementById('progress').innerHTML=`<progress max="17" value="${s.age-18}"></progress><small>${s.age} 歲 · 已完成 ${s.age-18}/17 年</small>`;let a=document.getElementById('app');if(!goalDone){a.innerHTML=`<section><h2>開始之前：你重視什麼？</h2>選擇2至3項未來生活條件。${goals.map(g=>`<label><input name="goal" type="checkbox" value="${g}"> ${g}</label>`).join('')}<button onclick="start()">開始人生</button></section>`;return}let end=s.age>=35||(branchEnd&&s.age>=branchEnd);let opts=options(),selected=opts.find(o=>o.id===pick);a.innerHTML=profile(s)+`${notice?`<section class="notice">${notice}</section>`:''}`+(end?`<section><h2>${branchEnd?'再次實驗成果':'35歲的人生成果'}</h2>${details(s)}${backup?`${compare(s,backup)}<button onclick="restore()">回到原路徑</button>`:`<label>想重來哪一年？ <select id="rewind">${s.history.map(h=>`<option value="${h.age}">${h.age}歲</option>`).join('')}</select></label><button onclick="rewind()">重新推演後續四年</button>`}<p>反思：哪個選擇最滿意？哪個最想改變？目前成果符合自己的生活目標嗎？</p></section>`:`<section><h2>${s.age}歲：今年要做什麼？</h2><p class="muted">金額以萬元計，已扣除每年12萬元基本生活費。每年可自由改變路徑，修業進度保留。</p><div class="tabs">${['教育','職訓','就業','特殊職缺','人生選擇'].map(t=>`<button class="secondary ${tab===t?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('')}</div><div id="decision-panel" class="decision-panel">${selected?`<p>選擇：<b>${selected.name}</b>｜預計年底存款 ${fmt(s.cash+selected.net-(lifeActivities.find(x=>x.id===lifePick)?.cost||0))} 萬（含當年收支，未計新增貸款）</p><p class="muted">年度可支配時間：${selected.free}天｜可用於體驗的預計資金：${fmt(Math.max(0,s.cash+selected.net))}萬。既有負債不限制體驗；免費體驗只需時間足夠，付費體驗須有足夠資金。</p><label>今年想安排的人生體驗（選填） <select onchange="setLife(this.value)"><option value="none">不另外安排</option>${lifeActivities.map(x=>`<option value="${x.id}" ${lifePick===x.id?'selected':''} ${!canLife(selected,x)?'disabled':''}>${x.name}｜${x.days}天｜${x.cost}萬${x.days>selected.free?"（時間不足）":!canLife(selected,x)?"（資金不足）":""}</option>`).join('')}</select></label>`:'<p>請先選擇一個年度行動。</p>'}<button ${selected?'':'disabled'} onclick="advance(options().find(o=>o.id===pick))">確認選擇並進入下一年</button></div><div class="cards" style="margin-top:14px">${opts.filter(o=>o.cat===tab).map(o=>`<div class="card ${pick===o.id?'selected':''}"><strong>${o.name}</strong><span class="${o.net<0?'negative':'positive'}">年度淨收支 ${o.net>0?'+':''}${fmt(o.net)} 萬</span><small>${o.desc}</small><small>年度可支配時間 ${o.free} 天</small><button ${o.ok?'':'disabled'} onclick="choose('${o.id}')">${o.ok?(pick===o.id?'已選擇':'選擇'):'資格尚未符合／已完成'}</button></div>`).join('')}</div></section>`)+`<section><h2>我的人生紀錄</h2><div class="scroll"><table><thead><tr><th>年齡</th><th>選擇</th><th>年收入（萬）</th><th>教育投入（萬）</th><th>淨收支</th><th>存款</th><th>負債</th><th>可支配天數</th><th>取得學歷／修業</th><th>新增技能</th><th>新增年資</th><th>人生體驗</th></tr></thead><tbody>${s.history.map(h=>`<tr><td>${h.age}→${h.age+1}</td><td>${h.name}</td><td>${fmt(h.salary||0)}</td><td>${fmt(h.educationCost||0)}</td><td>${fmt(h.net)}</td><td>${fmt(h.cash)}</td><td>${fmt(h.debt)}</td><td>${h.free}</td><td>${h.after.degree!==h.prior.degree?degreeNames[h.after.degree]+'畢業':education.filter(e=>(h.after.study[e[0]]||0)!==(h.prior.study[e[0]]||0)).map(e=>e[1]+' '+h.after.study[e[0]]+'/'+e[2]).join('、')||'—'}</td><td>${h.after.skills.filter(k=>!h.prior.skills.includes(k)).join('、')||'—'}</td><td>${Object.entries(h.after.exp).filter(([k,v])=>v>(h.prior.exp[k]||0)).map(([k,v])=>k+' +'+fmt(v-(h.prior.exp[k]||0))+'年').join('、')||'—'}</td><td>${h.after.experiences.slice(h.prior.experiences.length).join('、')||'—'}</td></tr>`).join('')}</tbody></table></div><p><button class="secondary" onclick="reset()">重新開始全部遊戲</button></p></section>`}render();
</script></body></html>
