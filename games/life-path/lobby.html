<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人生分岔路｜多人等候室</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4f1;color:#173e3b;font:16px/1.6 system-ui,sans-serif}main{max-width:720px;margin:auto;padding:22px}section{background:white;border-radius:16px;padding:22px;margin:16px 0}button,input,select{font:inherit;border-radius:9px;padding:12px;margin:5px 0}input:not([type=checkbox]),select{width:100%;border:1px solid #98aaa4}button{border:0;background:#173e3b;color:white;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#e5eeea;color:#173e3b}li{padding:8px;border-bottom:1px solid #ddd}#code{font-size:38px;letter-spacing:6px;font-weight:bold}#message{white-space:pre-wrap;color:#8d3434}a{color:inherit}[hidden]{display:none!important}
label{display:block;margin:8px 0}.choice{padding:12px;background:#eef4f1;border-radius:10px;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stats div{background:#eef4f1;padding:10px;border-radius:8px;overflow-wrap:anywhere}.career-card{border:1px solid #c6d7d0;border-radius:12px;padding:12px;margin:8px 0;background:white}.career-card.locked{background:#f0f2f1}.career-card.selected{border:2px solid #167d66}.career-card p{margin:4px 0;font-size:14px}.career-card strong{font-size:17px}.career-card .missing{color:#a43c32}.career-card button{width:100%}select{font-size:16px}#careerCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:18px}.career-card{margin:0;min-width:0}.career-card p{font-size:15px;line-height:1.6;overflow-wrap:anywhere}.career-card.locked{background:#f0f2f1;color:#28423e}.career-card .missing{color:#943225;font-weight:600}.career-card.selected{background:#e0f2e9}.career-card .requirements{padding:8px;background:#fff;border-radius:6px}@media(max-width:600px){#careerCards{grid-template-columns:1fr}main{padding:12px}section{padding:16px}}</style></head><body><main><a href="../../index.html">返回平台首頁</a><h1>人生分岔路</h1><p>多人遊戲・穩定成果版 0.8.3</p><section id="entry"><h2>主持人</h2><button id="create">建立房間</button><hr><h2>玩家</h2><label>房間代碼<input id="roomCode" maxlength="6" inputmode="numeric" autocomplete="off"></label><label>暱稱（不要使用真實姓名）<input id="nickname" maxlength="24" autocomplete="off"></label><button id="join">加入房間</button></section><section id="lobby" hidden><h2>等候室</h2><div id="code"></div><button id="copy" class="secondary">複製房間代碼</button><p id="count"></p><ul id="players"></ul><button id="ready" hidden>我準備好了</button><button id="start" hidden>開始遊戲</button><button id="close" class="secondary" hidden>結束測試房間</button><p id="phase"></p><button id="exit" class="secondary">返回首頁</button><p>開發測試：年度決策與結算。返回首頁不會移除房間內的玩家。</p></section><section id="turn" hidden><h2 id="turnTitle"></h2><div id="turnStats" class="stats"></div><div id="hostProgress" hidden></div><button id="settle" hidden>執行年度結算</button><button id="next" hidden>進入下一年度</button><div id="results" hidden></div><form id="decision" hidden><label>行動類型<select id="category"><option>教育</option><option>職訓</option><option>就業</option><option>特殊職缺</option><option>人生選擇</option></select></label><select id="mainChoice" hidden aria-hidden="true" tabindex="-1"></select><h3>年度主要行動與資格</h3><p id="careerHint">直接點選下方卡片。灰色卡片仍可查看完整資格。</p><div id="careerCards"></div><div id="choiceDetails" class="choice"></div><label id="fallbackLabel" hidden>未錄取時的備案<select id="fallback"></select></label><label>額外人生體驗<select id="activity"></select></label><label><input type="checkbox" id="acceptDebt"> 若年度資金不足，同意模擬就學貸款或生活支持（記為負債）</label><button id="submitTurn" type="submit">提交年度決策</button><p id="submitted" role="status"></p></form></section><p id="message" role="status"></p></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const client=createClient('https://kvajxqlrlsenovytxcqk.supabase.co','sb_publishable_VWFE8Kzt-Rc9IhLbjJ7AKg_60oNmlMS');
const $=id=>document.getElementById(id);let room=sessionStorage.getItem('lifeLobbyRoom'),state=null,busy=false,refreshing=false,pollPromise=null;
async function auth(){const {data,error}=await client.auth.getSession();if(error)throw error;if(!data.session){const result=await client.auth.signInAnonymously();if(result.error)throw result.error;}}
async function rpc(name,args={}){const {data,error}=await client.rpc(name,args);if(error)throw error;return data;}
function message(e){$('message').textContent=e?.message||String(e);}
async function action(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('message').textContent='';try{if(pollPromise)await pollPromise;await auth();await fn();}catch(e){message(e)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);if(turn&&!turn.host)$('submitTurn').disabled=turn.phase!=='decision'||!currentChoice();if(turn?.host)$('settle').disabled=!turn.players?.length||!turn.players.every(p=>p.submitted);}}
async function refresh(){if(!room||refreshing)return;refreshing=true;try{state=await rpc('lobby_status',{p_room_id:room});$('entry').hidden=true;$('lobby').hidden=false;$('code').textContent=state.code;$('count').textContent='已加入 '+state.players.length+' / '+state.max_players+' 人，已準備 '+state.players.filter(p=>p.ready).length+' 人';const rosterKey=JSON.stringify(state.players);if($('players').dataset.key!==rosterKey){$('players').dataset.key=rosterKey;$('players').replaceChildren(...state.players.map(p=>{const li=document.createElement('li');li.textContent=p.nickname+'　'+(p.ready?'已準備':'等待中');return li}));}$('ready').hidden=state.host||state.status!=='waiting';$('start').hidden=!state.host||state.status!=='waiting';$('close').hidden=!state.host||state.status==='finished';if(state.status!=='playing')$('phase').textContent=state.status==='finished'?'房間已結束':state.players.length>0&&state.players.every(p=>p.ready)?'所有玩家已準備，可開始遊戲':'等待玩家準備';$('ready').textContent=state.my_ready?'取消準備':'我準備好了';$('message').textContent='';if(state.status==='playing'){await refreshTurn()}else if(state.status==='finished'){await showResults(true)}else{$('turn').hidden=true;turnKey='';}}catch(e){message(e)}finally{refreshing=false;}}
async function enter(id){room=id;sessionStorage.setItem('lifeLobbyRoom',id);await refresh();}
$('create').onclick=()=>action(async()=>enter(await rpc('lobby_create')));
$('join').onclick=()=>action(async()=>enter(await rpc('lobby_join',{p_code:$('roomCode').value.trim(),p_nickname:$('nickname').value.trim()})));
$('start').onclick=()=>action(async()=>{if(!state.players.length||!state.players.every(p=>p.ready))throw Error('請至少加入一位玩家且所有玩家準備完成');await rpc('lobby_start',{p_room_id:room});await refresh()});
$('close').onclick=()=>action(async()=>{if(!confirm('確定結束測試房間？'))return;await rpc('lobby_close_test',{p_room_id:room});await refresh()});
$('ready').onclick=()=>action(async()=>{await rpc('lobby_ready',{p_room_id:room,p_ready:!state.my_ready});await refresh()});
$('copy').onclick=()=>action(async()=>{await navigator.clipboard.writeText(state.code);$('message').textContent='已複製房間代碼'});
$('exit').onclick=()=>{room=null;state=null;sessionStorage.removeItem('lifeLobbyRoom');$('entry').hidden=false;$('lobby').hidden=true;$('turn').hidden=true;turnKey='';turn=null;};

let turn=null,turnKey='';
const money=x=>(Number(x)/10000).toLocaleString('zh-TW');
const degreeNames=['高中職','專科','大學','碩士'];
function fillSelect(el,rows,selected){el.replaceChildren(...rows.map(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.label||x.name;o.disabled=!!x.disabled;return o}));if(rows.some(x=>x.id===selected&&!x.disabled))el.value=selected;}
function currentChoice(){return turn?.options?.find(x=>x.id===$('mainChoice').value);}
function refreshActivity(preferred){const o=currentChoice();if(!o)return;const f=o.cat==='特殊職缺'?turn.options.find(x=>x.id===$('fallback').value):null;const cash=turn.cash/10000;const valid=x=>[o,...(f?[f]:[])].every(y=>x.days<=y.free&&x.cost<=Math.max(0,cash+y.net));fillSelect($('activity'),turn.activities.map(x=>({...x,label:x.name+'｜'+x.days+'天｜'+x.cost+'萬'+(valid(x)?'':'（時間或資金不足）'),disabled:!valid(x)})),preferred||'none');}
function refreshChoice(preferredFallback,preferredActivity){const o=currentChoice();$('fallbackLabel').hidden=o?.cat!=='特殊職缺';if(!o){$('choiceDetails').textContent='此類別目前無符合資格的行動';$('submitTurn').disabled=true;$('activity').replaceChildren();return;}const cash=turn.cash/10000;$('choiceDetails').textContent='年收入 '+o.salary+' 萬｜教育費 '+o.fee+' 萬｜年度淨收支 '+o.net+' 萬｜可支配 '+o.free+' 天｜預計存款 '+(cash+o.net).toFixed(2)+' 萬（未計借款及體驗）';if(o.cat==='特殊職缺')fillSelect($('fallback'),turn.options.filter(x=>x.ok&&x.cat!=='特殊職缺'),preferredFallback||$('fallback').value);refreshActivity(preferredActivity);$('submitTurn').disabled=turn.phase!=='decision';}

function careerRequirements(o){const req=[],missing=[];const st=turn.state||{};if(o.min_degree!==undefined){req.push('學歷：'+degreeNames[o.min_degree]);if((st.degree||0)<o.min_degree)missing.push(degreeNames[o.min_degree]+'學歷');}if(o.min_degree!==undefined&&!o.required_skill)req.push('技能：無特定要求');if(o.required_skill){req.push('技能：'+o.required_skill);for(const skill of o.required_skill.split('、'))if(!(st.skills||[]).includes(skill))missing.push(skill+'技能');}if(o.min_degree!==undefined&&!o.required_exp)req.push('相關年資：無要求');if(o.required_exp>0){req.push(o.industry+'年資：'+o.required_exp+'年（目前 '+(st.exp?.[o.industry]||0)+'年）');if((st.exp?.[o.industry]||0)<o.required_exp)missing.push('相關年資不足');}if(o.study){req.push('修業進度：'+(st.study?.[o.study]||0)+'/'+o.len+'年');if(o.study==='master'&&(st.degree||0)<2)missing.push('大學學歷');}return {req,missing};}
function renderCareerCards(){const root=$('careerCards');root.replaceChildren();const opts=turn.options.filter(o=>o.cat===$('category').value);$('careerHint').textContent='本類別 '+opts.length+' 項，符合資格 '+opts.filter(o=>o.ok).length+' 項。未符合的職缺仍列出完整門檻。';if(!opts.length)line(root,'p','本年度沒有此類別的開放行動。');for(const o of opts){const card=document.createElement('div');card.className='career-card'+(!o.ok?' locked':'')+($('mainChoice').value===o.id?' selected':'');line(card,'strong',o.name);line(card,'p','年收入 '+o.salary+'萬｜淨收支 '+o.net+'萬｜可支配 '+o.free+'天');const {req,missing}=careerRequirements(o);const requirements=document.createElement('div');requirements.className='requirements';line(requirements,'strong','資格條件');for(const item of req.length?req:['無額外資格限制'])line(requirements,'p',item);card.append(requirements);if(o.condition)line(card,'p','工作條件：'+o.condition);const status=line(card,'p',o.ok?'符合資格':missing.length?'尚缺：'+missing.join('、'):'已完成或目前不可選');if(!o.ok)status.className='missing';if(o.ok){const b=document.createElement('button');b.type='button';b.textContent=$('mainChoice').value===o.id?'已選擇':'選擇此行動';b.onclick=()=>{$('mainChoice').value=o.id;refreshChoice();renderCareerCards();$('choiceDetails').scrollIntoView({block:'nearest'});};card.append(b);}root.append(card);} }

function refreshCategory(preferred,fb,act){const opts=turn.options.filter(x=>x.cat===$('category').value);fillSelect($('mainChoice'),opts.filter(x=>x.ok).map(x=>({...x,label:x.name+'｜淨收支 '+x.net+'萬'})),preferred);if(!opts.some(x=>x.ok))$('mainChoice').selectedIndex=-1;refreshChoice(fb,act);renderCareerCards();}
async function refreshTurn(){const id=room;const next=await rpc('life_turn',{p_room_id:id});if(room!==id)return;if(turn&&turn.roomId===id&&(next.round<turn.round||(next.round===turn.round&&turn.phase==='result'&&next.phase==='decision')))return;turn={...next,roomId:id};if(turn.phase==='result'){await showResults(false);return;}$('phase').textContent='第 '+turn.round+' 回合｜決策中';$('turn').hidden=false;$('turnTitle').textContent='第 '+turn.round+' 回合｜'+(17+turn.round)+' 歲';$('hostProgress').hidden=!turn.host;$('decision').hidden=turn.host||turn.phase!=='decision';$('settle').hidden=!turn.host||turn.phase!=='decision';$('next').hidden=!turn.host||turn.phase!=='result';$('next').textContent=turn.round>=17?'完成遊戲':'進入下一年度';$('results').hidden=turn.phase!=='result';if(turn.host){$('turnStats').replaceChildren();const h=document.createElement('p');h.textContent='已提交 '+turn.players.filter(p=>p.submitted).length+' / '+turn.players.length+' 人';const ul=document.createElement('ul');for(const p of turn.players){const li=document.createElement('li');li.textContent=p.nickname+'｜'+(p.submitted?'已提交':'尚未提交');ul.append(li)}$('hostProgress').replaceChildren(h,ul);$('settle').disabled=!turn.players.length||!turn.players.every(p=>p.submitted);return;}
const stats=[['存款',money(turn.cash)+' 萬'],['負債',money(turn.debt)+' 萬'],['學歷',degreeNames[turn.state?.degree||0]],['技能',(turn.state?.skills||[]).join('、')||'尚無'],['年資',Object.entries(turn.state?.exp||{}).map(([k,v])=>k+' '+v+'年').join('、')||'尚無'],['累積可支配天數',turn.free_days+' 天']];$('turnStats').replaceChildren(...stats.map(([k,v])=>{const d=document.createElement('div');d.textContent=k+'：'+v;return d}));
const key=id+':'+turn.round;if(key!==turnKey){turnKey=key;const d=turn.decision;const chosen=turn.options.find(x=>x.id===d?.main);$('category').value=chosen?.cat||'教育';$('acceptDebt').checked=!!d?.data?.accept_debt;refreshCategory(d?.main,d?.data?.fallback,d?.activity);}
$('submitted').textContent=turn.decision?'已提交：'+(turn.options.find(x=>x.id===turn.decision.main)?.name||turn.decision.main)+'。結算前仍可修改。':'尚未提交年度決策';$('submitTurn').disabled=turn.phase!=='decision'||!currentChoice();}
$('category').onchange=()=>refreshCategory();$('mainChoice').onchange=()=>{refreshChoice();renderCareerCards();};$('fallback').onchange=()=>refreshActivity($('activity').value);
$('decision').onsubmit=e=>{e.preventDefault();action(async()=>{const o=currentChoice();if(!o?.ok)throw Error('請選擇符合資格的行動');await rpc('life_submit',{p_room_id:room,p_round:turn.round,p_main:o.id,p_activity:$('activity').value,p_fallback:o.cat==='特殊職缺'?$('fallback').value:null,p_accept_debt:$('acceptDebt').checked});await refreshTurn()});};


function line(parent,tag,value){const el=document.createElement(tag);el.textContent=value;parent.append(el);return el;}
async function showResults(finished){const id=room;const data=await rpc('life_results',{p_room_id:id});if(id!==room)return;const root=$('results');if(!finished&&(data.phase!=='result'||data.settled!==data.round))return;const resultKey=JSON.stringify([id,finished,data]);if(root.dataset.renderKey===resultKey&&!root.hidden)return;root.dataset.renderKey=resultKey;$('phase').textContent=finished?'房間已結束':'第 '+data.round+' 回合｜'+(17+data.round)+' → '+(18+data.round)+' 歲';$('turn').hidden=false;root.hidden=false;$('decision').hidden=true;$('hostProgress').hidden=true;$('settle').hidden=true;$('next').hidden=finished||!data.host||data.phase!=='result';$('next').textContent=data.round>=17?'完成遊戲':'進入下一年度';$('turnStats').replaceChildren();$('turnTitle').textContent=finished?(data.settled===17?'35歲｜最終成果':'測試房間已結束'):'第 '+data.round+' 回合｜'+(17+data.round)+' → '+(18+data.round)+' 歲年度成果';root.replaceChildren();
if(data.host){line(root,'h3','玩家目前成果');for(const p of data.history){line(root,'p',p.nickname+'｜'+p.age+'歲｜存款 '+money(p.cash)+'萬｜負債 '+money(p.debt)+'萬｜淨資產 '+money(p.cash-p.debt)+'萬｜'+degreeNames[p.state?.degree||0]+'｜可支配 '+p.free_days+'天');}}
else{const last=data.history.at(-1);if(last){const x=last.result_data;line(root,'h3',last.age+' → '+(last.age+1)+' 歲：'+x.actual);if(x.fallback_used)line(root,'p','特殊職缺未錄取，採用備案。原申請：'+x.requested);for(const [k,v] of [['年度收入',money(last.income)+'萬'],['年度支出',money(last.expenses)+'萬'],['期末存款',money(last.ending_cash)+'萬'],['期末負債',money(last.ending_debt)+'萬'],['淨資產',money(last.ending_cash-last.ending_debt)+'萬'],['新增借款',x.loan+'萬'],['人生體驗',x.activity],['可支配天數',x.free_days+'天'],['學歷',degreeNames[x.after?.degree||0]],['技能',(x.after?.skills||[]).join('、')||'尚無'],['年資',Object.entries(x.after?.exp||{}).map(([k,v])=>k+' '+v+'年').join('、')||'尚無']])line(root,'p',k+'：'+v);line(root,'h3','歷年紀錄');for(const h of data.history)line(root,'p',h.age+'歲｜'+h.result_data.actual+'｜存款 '+money(h.ending_cash)+'萬｜負債 '+money(h.ending_debt)+'萬');}else line(root,'p','尚無已結算年度');}
for(const e of data.events.filter(e=>e.round_number===data.settled))line(root,'p','共同事件：'+e.description);
if(!finished&&!data.host)line(root,'p','等待主持人開啟下一年度。');
}
$('settle').onclick=()=>action(async()=>{if(!turn?.host||!confirm('確定結算本年度？提交後將不能修改。'))return;await rpc('life_settle',{p_room_id:room,p_round:turn.round});await refresh()});
$('next').onclick=()=>action(async()=>{if(!turn?.host)return;await rpc('life_next',{p_room_id:room,p_round:turn.round});await refresh()});

if(room)action(refresh);setInterval(()=>{if(room&&!busy&&!pollPromise){pollPromise=refresh().finally(()=>{pollPromise=null;});}},3000);
</script></body></html>
