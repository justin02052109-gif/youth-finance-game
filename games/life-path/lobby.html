body{background:#f1f5f2;color:var(--ink);font-size:16px}main{max-width:1020px;padding:20px 24px 36px}main>a{font-size:13px;text-decoration:none;color:var(--muted)}.hero{background:#173e3b;color:#fff;border-radius:20px;padding:24px 28px;margin:12px 0 18px}.hero h1{font-size:clamp(28px,5vw,42px);letter-spacing:.03em;margin:4px 0}.hero p{margin:4px 0 10px;color:#dcece5}.hero small{color:#c5e3d4;font-size:12px}section{box-shadow:0 3px 16px #173e3b0a;border:1px solid var(--line);padding:22px}h2{margin-top:0;font-size:23px}h3{font-size:18px}button{font-weight:650;min-height:44px;background:var(--ink);transition:background .15s}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #d3a548;outline-offset:2px}button.secondary{background:#eaf2ed}button:disabled{opacity:.48;cursor:not-allowed}.stats div{background:#f0f6f2}#quickStats{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:10px}#quickStats strong{display:block;font-size:21px}#quickStats small{display:block;color:var(--muted);font-size:12px}#profileDetails summary{cursor:pointer;font-weight:650;padding:10px 2px}#profileStats{margin-top:10px}#yearProgress{padding:14px 18px;background:#fff;border:1px solid var(--line);border-radius:14px}.progress-label{display:flex;justify-content:space-between;gap:10px;font-size:14px}progress{height:10px;border:0;border-radius:99px;overflow:hidden}#gameNav{font-size:13px}.category-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.category-tabs button{flex:1;white-space:nowrap;background:#e8f1ec;color:var(--ink);margin:0;padding:10px 12px}.category-tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}.filter-row{display:flex;gap:10px;align-items:flex-end}.filter-row label{flex:1;min-width:0;font-size:13px}.eligible-toggle{display:flex;gap:8px;align-items:center;font-size:14px}.career-card{padding:14px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:14px}.career-card strong{font-size:18px}.career-card.selected{border-color:#167d66;box-shadow:0 0 0 2px #167d66 inset}.career-card button{margin-top:auto}.career-card.locked{background:#f4f5f4}.career-card .requirements{background:#fff;border:1px solid #e4ebe6}.career-card p{font-size:14px}.choice{border:1px solid var(--line);padding:16px}#careerHint,#repayLimit{color:var(--muted);font-size:14px}.decision-footer{position:sticky;bottom:0;z-index:3;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 -4px 20px #173e3b15;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}.decision-footer p{margin:2px 0;font-size:12px;color:var(--muted)}.decision-footer button{flex-shrink:0;margin:0}#hostProgress ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));list-style:none;padding:0;gap:8px}#hostProgress li{border:1px solid var(--line);border-radius:8px;background:#f1f6f2}#message:not(:empty){position:sticky;bottom:0;background:#fff2ed;border:1px solid #e7b9a9;padding:10px;border-radius:8px;z-index:4}#repayPreview{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}#repayPreview p{margin:3px 0;font-size:14px}
@media(max-width:600px){main{padding:12px 10px 24px}.hero{padding:17px 18px;border-radius:15px;margin:8px 0 12px}.hero p{font-size:14px}section{padding:15px;margin:12px 0;border-radius:14px}#quickStats{gap:5px}#quickStats div{padding:8px 5px}#quickStats strong{font-size:17px}#quickStats small{font-size:11px}.category-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.category-tabs button{padding:9px 5px;font-size:14px}.filter-row{flex-wrap:wrap}.filter-row label{min-width:130px}.decision-footer{bottom:0;padding:9px 8px calc(9px + env(safe-area-inset-bottom));gap:7px}.decision-footer button{font-size:14px;padding:10px}.decision-footer strong{font-size:14px}.decision-footer p{font-size:11px}#gameNav button{font-size:12px;padding:8px;min-height:38px}}

#readyArea{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}#readyArea p{font-size:14px;color:var(--muted);margin:0 0 8px}#readyArea button{width:100%}body[data-stage="game"] #readyArea{display:none!important}</style></head><body><main><a href="../../index.html">返回平台首頁</a><header class="hero"><small> LIFE PATH · 生涯探索</small><h1>人生分岔路</h1><p>每一年，都是一次新的選擇。</p><small>多人遊戲・生涯探索版 0.11.1</small></header><div id="yearProgress" hidden><div class="progress-label"><strong id="yearLabel"></strong><span id="yearCount"></span></div><progress id="yearBar" max="17" value="0"></progress></div><section id="entry"><h2>主持人</h2><button id="create">建立房間</button><hr><h2>玩家</h2><label>房間代碼<input id="roomCode" maxlength="6" inputmode="numeric" autocomplete="off"></label><label>暱稱（不要使用真實姓名）<input id="nickname" maxlength="24" autocomplete="off"></label><button id="join">加入房間</button></section><section id="lobby" hidden><div id="waitingInfo"><h2>等候室</h2><div id="code"></div><button id="copy" class="secondary">複製房間代碼</button><p id="count"></p><ul id="players"></ul><button id="start" hidden>開始遊戲</button></div><button id="waitingExit" type="button" class="secondary">返回首頁</button><p id="waitingNote">開發測試：返回首頁不會移除房間內的玩家。</p></section><nav id="gameNav" hidden><button id="close" class="secondary" hidden>結束測試房間</button><p id="phase"></p><button id="exit" class="secondary">返回首頁</button></nav><section id="profilePanel" hidden><div id="quickStats" class="stats"></div><details id="profileDetails"><summary>查看完整生涯資歷</summary><div id="profileStats" class="stats"></div></details><form id="goalsForm" hidden><h3>我的生活目標（選2至3項）</h3><div id="goalsList" class="goal-grid"></div><button type="submit">儲存生活目標</button><p id="goalsNote"></p></form><div id="readyArea" hidden><p id="readyHint">請先儲存生活目標，再確認準備完成。</p><button id="ready" type="button" hidden>我準備好了</button></div></section><section id="turn" hidden><h2 id="turnTitle"></h2><div id="turnStats" class="stats"></div><div id="hostProgress" hidden></div><button id="settle" hidden>執行年度結算</button><button id="next" hidden>進入下一年度</button><div id="results" hidden></div><form id="decision" hidden><h3>01　選擇今年的方向</h3><div id="categoryTabs" class="category-tabs" role="group" aria-label="行動類型"></div><label hidden>行動類型<select id="category"><option>教育</option><option>職訓</option><option>就業</option><option>特殊職缺</option><option>人生選擇</option></select></label><select id="mainChoice" hidden aria-hidden="true" tabindex="-1"></select><h3>年度主要行動與資格</h3><div class="filter-row"><label>搜尋職業或行動<input id="careerSearch" type="search" placeholder="例如：水電、行政"></label><label id="industryLabel" hidden>產業<select id="industryFilter"><option value="">全部產業</option></select></label></div><label class="eligible-toggle"><input id="eligibleOnly" type="checkbox"> 只看符合資格的行動</label><p id="careerHint">直接點選下方卡片。灰色卡片仍可查看完整資格。</p><div id="careerCards"></div><h3 id="planningHeading">02　安排今年的生活</h3><div id="choiceDetails" class="choice"></div><label id="fallbackLabel" hidden>未錄取時的備案<select id="fallback"></select></label><label>額外人生體驗<select id="activity"></select></label><label><input type="checkbox" id="acceptDebt"> 若年度資金不足，同意模擬就學貸款或生活支持（記為負債）</label><div class="choice" id="annualBudget"><h3>03　年度預算與還款</h3><p id="repayLimit"></p><label>本年度還款金額（元）<input id="repayAmount" type="number" min="0" step="1" inputmode="numeric" value="0" required></label><button type="button" id="repayZero" class="secondary">暫不還款</button> <button type="button" id="repayMax" class="secondary">最多可還</button><h3>預計年度成果</h3><div id="repayPreview" class="stats"></div></div><div id="decisionFooter" class="decision-footer"><div><strong id="selectedSummary">尚未選擇行動</strong><p id="submitted" role="status"></p></div><button id="submitTurn" type="submit">提交年度決策</button></div></form></section><p id="message" role="status"></p></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const client=createClient('https://kvajxqlrlsenovytxcqk.supabase.co','sb_publishable_VWFE8Kzt-Rc9IhLbjJ7AKg_60oNmlMS');
const $=id=>document.getElementById(id);let room=sessionStorage.getItem('lifeLobbyRoom'),state=null,busy=false,refreshing=false,pollPromise=null;
async function auth(){const {data,error}=await client.auth.getSession();if(error)throw error;if(!data.session){const result=await client.auth.signInAnonymously();if(result.error)throw result.error;}}
async function rpc(name,args={}){const {data,error}=await client.rpc(name,args);if(error)throw error;return data;}
function message(e){$('message').textContent=e?.message||String(e);}
async function action(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('message').textContent='';try{if(pollPromise)await pollPromise;await auth();await fn();}catch(e){message(e)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);if(turn&&!turn.host)$('submitTurn').disabled=turn.phase!=='decision'||!currentChoice();if(turn?.host)$('settle').disabled=!turn.players?.length||!turn.players.every(p=>p.submitted);applyProfileControls();}}
async function refresh(){if(!room||refreshing)return;refreshing=true;try{state=await rpc('lobby_status',{p_room_id:room});$('entry').hidden=true;const waiting=state.status==='waiting';$('yearProgress').hidden=waiting;document.body.dataset.role=state.host?'host':'player';if(!waiting&&(!turn||turn.round!==state.current_round))showYear(state.current_round,'decision');document.body.dataset.stage=waiting?'waiting':'game';$('lobby').hidden=!waiting;$('gameNav').hidden=waiting;$('waitingInfo').hidden=!waiting;$('waitingNote').hidden=!waiting;$('goalsForm').hidden=!waiting;$('code').textContent=waiting?state.code:'';$('count').textContent='已加入 '+state.players.length+' / '+state.max_players+' 人，已準備 '+state.players.filter(p=>p.ready).length+' 人';const rosterKey=JSON.stringify(state.players);if($('players').dataset.key!==rosterKey){$('players').dataset.key=rosterKey;$('players').replaceChildren(...state.players.map(p=>{const li=document.createElement('li');li.textContent=p.nickname+'　'+(p.ready?'已準備':'等待中');return li}));}$('ready').hidden=state.host||state.status!=='waiting';$('readyArea').hidden=state.host||state.status!=='waiting';$('start').hidden=!state.host||state.status!=='waiting';$('close').hidden=!state.host||state.status==='finished';if(state.status!=='playing')$('phase').textContent=state.status==='finished'?'房間已結束':state.players.length>0&&state.players.every(p=>p.ready)?'所有玩家已準備，可開始遊戲':'等待玩家準備';$('ready').textContent=state.my_ready?'取消準備':'我準備好了';$('message').textContent='';if(!state.host){await refreshProfile()}else{$('profilePanel').hidden=true;profile=null;profileKey='';}if(state.status==='playing'){await refreshTurn()}else if(state.status==='finished'){await showResults(true)}else{$('turn').hidden=true;turnKey='';}}catch(e){message(e)}finally{refreshing=false;}}
async function enter(id){room=id;sessionStorage.setItem('lifeLobbyRoom',id);await refresh();}
$('create').onclick=()=>action(async()=>enter(await rpc('lobby_create')));
$('join').onclick=()=>action(async()=>enter(await rpc('lobby_join',{p_code:$('roomCode').value.trim(),p_nickname:$('nickname').value.trim()})));
$('start').onclick=()=>action(async()=>{if(!state.players.length||!state.players.every(p=>p.ready))throw Error('請至少加入一位玩家且所有玩家準備完成');await rpc('lobby_start',{p_room_id:room});await refresh()});
$('close').onclick=()=>action(async()=>{if(!confirm('確定結束測試房間？'))return;await rpc('lobby_close_test',{p_room_id:room});await refresh()});
$('ready').onclick=()=>action(async()=>{if(!state.my_ready&&(!profile||!hasGoals()))throw Error('請先儲存2至3項生活目標');await rpc('lobby_ready',{p_room_id:room,p_ready:!state.my_ready});await refresh()});
$('copy').onclick=()=>action(async()=>{await navigator.clipboard.writeText(state.code);$('message').textContent='已複製房間代碼'});
$('waitingExit').onclick=$('exit').onclick=()=>{room=null;state=null;$('yearProgress').hidden=true;delete document.body.dataset.stage;sessionStorage.removeItem('lifeLobbyRoom');$('entry').hidden=false;$('lobby').hidden=true;$('gameNav').hidden=true;$('turn').hidden=true;turnKey='';turn=null;profile=null;profileKey='';$('profilePanel').hidden=true;};

let turn=null,turnKey='';
const money=x=>(Number(x)/10000).toLocaleString('zh-TW');
const degreeNames=['高中職','專科','大學','碩士'];
function fillSelect(el,rows,selected){el.replaceChildren(...rows.map(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.label||x.name;o.disabled=!!x.disabled;return o}));if(rows.some(x=>x.id===selected&&!x.disabled))el.value=selected;}
function currentChoice(){return turn?.options?.find(x=>x.id===$('mainChoice').value);}
function refreshActivity(preferred){const o=currentChoice();if(!o)return;const f=o.cat==='特殊職缺'?turn.options.find(x=>x.id===$('fallback').value):null;const cash=turn.cash/10000;const valid=x=>[o,...(f?[f]:[])].every(y=>x.days<=y.free&&x.cost<=Math.max(0,cash+y.net));fillSelect($('activity'),turn.activities.map(x=>({...x,label:x.name+'｜'+x.days+'天｜'+x.cost+'萬'+(valid(x)?'':'（時間或資金不足）'),disabled:!valid(x)})),preferred||'none');updateBudget();}
function refreshChoice(preferredFallback,preferredActivity){const o=currentChoice();$('fallbackLabel').hidden=o?.cat!=='特殊職缺';if(!o){$('choiceDetails').textContent='此類別目前無符合資格的行動';$('submitTurn').disabled=true;$('activity').replaceChildren();updateBudget();return;}const cash=turn.cash/10000;$('choiceDetails').textContent='年收入 '+o.salary+' 萬｜教育費 '+o.fee+' 萬｜年度淨收支 '+o.net+' 萬｜可支配 '+o.free+' 天｜預計存款 '+(cash+o.net).toFixed(2)+' 萬（未計借款及體驗）';if(o.cat==='特殊職缺')fillSelect($('fallback'),turn.options.filter(x=>x.ok&&x.cat!=='特殊職缺'),preferredFallback||$('fallback').value);refreshActivity(preferredActivity);$('submitTurn').disabled=turn.phase!=='decision';}

function careerRequirements(o){const req=[],missing=[];const st=turn.state||{};if(o.min_degree!==undefined){req.push('學歷：'+degreeNames[o.min_degree]);if((st.degree||0)<o.min_degree)missing.push(degreeNames[o.min_degree]+'學歷');}if(o.min_degree!==undefined&&!o.required_skill)req.push('技能：無特定要求');if(o.required_skill){req.push('技能：'+o.required_skill);for(const skill of o.required_skill.split('、'))if(!(st.skills||[]).includes(skill))missing.push(skill+'技能');}if(o.min_degree!==undefined&&!o.required_exp)req.push('相關年資：無要求');if(o.required_exp>0){req.push(o.industry+'年資：'+o.required_exp+'年（目前 '+(st.exp?.[o.industry]||0)+'年）');if((st.exp?.[o.industry]||0)<o.required_exp)missing.push('相關年資不足');}if(o.study){req.push('修業進度：'+(st.study?.[o.study]||0)+'/'+o.len+'年');if(o.study==='master'&&(st.degree||0)<2)missing.push('大學學歷');}return {req,missing};}
function renderCareerCards(){const root=$('careerCards');root.replaceChildren();const all=turn.options.filter(o=>o.cat===$('category').value);const query=$('careerSearch').value.trim().toLowerCase(),industry=$('industryFilter').value;const opts=all.filter(o=>(!$('eligibleOnly').checked||o.ok)&&(!industry||o.industry===industry)&&(!query||[o.name,o.industry,o.required_skill].filter(Boolean).join(' ').toLowerCase().includes(query)));$('careerHint').textContent='顯示 '+opts.length+' / '+all.length+' 項，符合資格 '+all.filter(o=>o.ok).length+' 項。';if(!opts.length)line(root,'p','沒有符合目前篩選條件的行動，請調整篩選。');for(const o of opts){const card=document.createElement('div');card.className='career-card'+(!o.ok?' locked':'')+($('mainChoice').value===o.id?' selected':'');line(card,'strong',o.name);line(card,'p','年收入 '+o.salary+'萬｜淨收支 '+o.net+'萬｜可支配 '+o.free+'天');const {req,missing}=careerRequirements(o);const requirements=document.createElement('div');requirements.className='requirements';line(requirements,'strong','資格條件');for(const item of req.length?req:['無額外資格限制'])line(requirements,'p',item);card.append(requirements);if(o.condition)line(card,'p','工作條件：'+o.condition);const status=line(card,'p',o.ok?'符合資格':missing.length?'尚缺：'+missing.join('、'):'已完成或目前不可選');if(!o.ok)status.className='missing';if(o.ok){const b=document.createElement('button');b.type='button';b.textContent=$('mainChoice').value===o.id?'已選擇':'選擇此行動';b.onclick=()=>{$('mainChoice').value=o.id;refreshChoice();renderCareerCards();$('choiceDetails').scrollIntoView({block:'nearest'});};card.append(b);}root.append(card);} }

line(root,'h3','個別玩家成果');const heads=['玩家代號','暱稱','年齡','存款（元）','負債（元）','淨資產（元）','學歷','技能','產業年資','可支配天數','生活目標','人生體驗'];const rows=ps.map((p,i)=>[codes[i],p.nickname,p.age,p.cash,p.debt,p.cash-p.debt,degreeNames[p.state?.degree||0],(p.state?.skills||[]).join('、'),Object.entries(p.state?.exp||{}).map(([k,v])=>k+':'+v).join('、'),p.free_days,(p.state?.goals||[]).join('、'),(p.state?.experiences||[]).join('、')]);groupTable(root,['玩家','淨資產（萬）','學歷','年資','可支配天數'],ps.map((p,i)=>[codes[i]+' '+p.nickname,money(p.cash-p.debt),degreeNames[p.state?.degree||0],f(exp(p)),p.free_days]));
line(root,'h3','匯出團體成果（CSV）');line(root,'p','預設以玩家代號匯出，不含暱稱、帳號或識別碼。請勿公開個別成果，並依機構規範保存。');const b=line(root,'button','下載個人摘要 CSV');b.type='button';b.onclick=()=>csvExport('人生分岔路_團體摘要.csv',[heads.filter((_,i)=>i!==1),...rows.map(row=>row.filter((_,i)=>i!==1))]);const b2=line(root,'button','下載歷年決策 CSV');b2.type='button';b2.className='secondary';b2.onclick=()=>csvExport('人生分岔路_歷年決策.csv',[['玩家代號','回合','起始年齡','主要類別','實際行動','人生體驗','收入（元）','支出（元）','期末存款（元）','期末負債（元）','可支配天數','體驗天數','借款（萬）','還款（萬）','教育費（萬）','體驗費（萬）','採用備案'],...ps.flatMap((p,i)=>p.history.map(h=>[codes[i],h.round,h.age,h.category,h.action,h.activity,h.income,h.expenses,h.cash,h.debt,h.free_days,h.used_days,h.loan,h.repaid||0,h.education_cost,h.activity_cost,h.fallback_used?'是':'否']))]);
}

async function showResults(finished){const id=room;const data=await rpc('life_results',{p_room_id:id});if(id!==room)return;const root=$('results');if(!finished&&(data.phase!=='result'||data.settled!==data.round))return;const group=data.host?await rpc('life_group_report',{p_room_id:id}):null;if(id!==room)return;const resultKey=JSON.stringify([id,finished,data,group]);if(root.dataset.renderKey===resultKey&&!root.hidden)return;root.dataset.renderKey=resultKey;showYear(data.round,finished?'finished':'result',data.settled);$('phase').textContent=finished?'房間已結束':'第 '+data.round+' 回合｜'+(17+data.round)+' → '+(18+data.round)+' 歲';$('turn').hidden=false;root.hidden=false;$('decision').hidden=true;$('hostProgress').hidden=true;$('settle').hidden=true;$('next').hidden=finished||!data.host||data.phase!=='result';$('next').textContent=data.round>=17?'完成遊戲':'進入下一年度';$('turnStats').replaceChildren();$('turnTitle').textContent=finished?(data.settled===17?'35歲｜最終成果':'測試房間已結束'):'第 '+data.round+' 回合｜'+(17+data.round)+' → '+(18+data.round)+' 歲年度成果';root.replaceChildren();
if(data.host){groupReport(root,group);}
else if(finished&&data.settled===17){finalReport(root,data);}
else{const last=data.history.at(-1);if(last){const x=last.result_data;line(root,'h3',last.age+' → '+(last.age+1)+' 歲：'+x.actual);if(x.fallback_used)line(root,'p','特殊職缺未錄取，採用備案。原申請：'+x.requested);for(const [k,v] of [['年度收入',money(last.income)+'萬'],['年度支出',money(last.expenses)+'萬'],['期末存款',money(last.ending_cash)+'萬'],['期末負債',money(last.ending_debt)+'萬'],['淨資產',money(last.ending_cash-last.ending_debt)+'萬'],['新增借款',x.loan+'萬'],['已償還負債',(x.repaid||0)+'萬'],['人生體驗',x.activity],['可支配天數',x.free_days+'天'],['學歷',degreeNames[x.after?.degree||0]],['技能',(x.after?.skills||[]).join('、')||'尚無'],['年資',Object.entries(x.after?.exp||{}).map(([k,v])=>k+' '+v+'年').join('、')||'尚無']])line(root,'p',k+'：'+v);line(root,'h3','歷年紀錄');for(const h of data.history)line(root,'p',h.age+'歲｜'+h.result_data.actual+'｜存款 '+money(h.ending_cash)+'萬｜負債 '+money(h.ending_debt)+'萬');}else line(root,'p','尚無已結算年度');}
for(const e of data.events.filter(e=>e.round_number===data.settled))line(root,'p','共同事件：'+e.description);
if(!finished&&!data.host)line(root,'p','等待主持人開啟下一年度。');
}
$('settle').onclick=()=>action(async()=>{if(!turn?.host||!confirm('確定結算本年度？提交後將不能修改。'))return;await rpc('life_settle',{p_room_id:room,p_round:turn.round});await refresh()});
$('next').onclick=()=>action(async()=>{if(!turn?.host)return;await rpc('life_next',{p_room_id:room,p_round:turn.round});await refresh()});

function showYear(round,phase,settled){const r=Math.max(1,Math.min(17,Number(round)||1));const done=settled??(phase==='result'?r:phase==='finished'?r:r-1);$('yearBar').value=done;$('yearLabel').textContent=phase==='finished'?(done===17?'35歲｜人生旅程完成':'遊戲已結束'):phase==='result'?(17+r)+' → '+(18+r)+'歲｜年度成果':(17+r)+'歲｜年度決策';$('yearCount').textContent=done+' / 17 年';}
function syncCategories(){if(!turn||turn.host)return;const cat=$('category').value;const tabs=$('categoryTabs');if(!tabs.children.length)for(const name of ['教育','職訓','就業','特殊職缺','人生選擇']){const b=document.createElement('button');b.type='button';b.textContent=name;b.onclick=()=>{$('category').value=name;$('careerSearch').value='';$('industryFilter').value='';refreshCategory();};tabs.append(b);}for(const b of tabs.children)b.setAttribute('aria-pressed',String(b.textContent===cat));const industry=$('industryFilter'),previous=industry.value;const vals=[...new Set(turn.options.filter(o=>o.cat===cat&&o.industry).map(o=>o.industry))].sort();fillSelect(industry,[{id:'',name:'全部產業'},...vals.map(v=>({id:v,name:v}))],previous);$('industryLabel').hidden=!vals.length;}
$('careerSearch').oninput=renderCareerCards;$('eligibleOnly').onchange=renderCareerCards;$('industryFilter').onchange=renderCareerCards;

if(room)action(refresh);setInterval(()=>{if(room&&!busy&&!pollPromise){pollPromise=refresh().finally(()=>{pollPromise=null;});}},3000);
</script></body></html>
